name: talqui_flutter
description: Add Talqui live chat to your Flutter app. Full screen or inline, identified users, conversation data and chat events.
version: 0.1.0
homepage: https://docs.talqui.chat/guides/chat-sdks/flutter
repository: https://github.com/talqui-oss/talqui-sdk-flutter
issue_tracker: https://github.com/talqui-oss/talqui-sdk-flutter/issues
topics: [chat, live-chat, customer-support, webview, talqui]

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.18.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
