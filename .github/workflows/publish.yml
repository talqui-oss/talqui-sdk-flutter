name: publish

# Publishes to pub.dev through automated publishing (OIDC), with no credentials stored.
# Started by a pushed `v*` tag, or by release.yml on that tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Run on the tag v$version (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Sets up the pub.dev OIDC token; flutter pub publish reads the same credentials.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - name: Publish
        run: |
          # Already on pub.dev (the first version is published by hand): only release.
          if curl -fs "https://pub.dev/api/packages/talqui_flutter/versions/$VERSION" >/dev/null; then
            echo "$VERSION is already on pub.dev"
          else
            flutter pub publish --force
          fi
      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          awk '/^##? \[?[0-9]/{if (found) exit; found=1; next} found' CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --prerelease --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --latest --notes-file notes.md
          fi
