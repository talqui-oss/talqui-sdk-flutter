name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: SDK label matches the pubspec version
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')"
          grep -q "flutter@$version'" lib/src/protocol.dart
      - run: flutter pub publish --dry-run
